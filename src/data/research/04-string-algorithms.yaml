title: String algorithms
summary: Reversible decompositions of strings and the structure they expose.
body: >-
  Flashback is a reversible decomposition that peels maximal runs from both
  ends of a string at once. A run-pairing theorem gives exact token counts, a
  characterization of palindromes and an edit-locality result. It is the
  decomposition underlying FlashbackGraph and is of independent interest in
  combinatorics on words.
publications: [2026-flashback]
