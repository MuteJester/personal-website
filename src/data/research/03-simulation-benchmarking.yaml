title: Simulation and benchmarking
summary: Simulators with full ground truth, for benchmarking immunogenetics tools.
body: >-
  Immunogenetics tools are hard to evaluate because real data has no ground
  truth. GenAIRR simulates V(D)J recombination, somatic hypermutation and
  sequencing corruption with full annotations, across 23 species. We used it for
  a systematic comparison of immunoglobulin aligners (Briefings in
  Bioinformatics, 2024), and it now provides the training data for AlignAIR and
  for community benchmarks.
publications: [2024-genairr-aligner-benchmark]
software: [genairr]
order: 3
