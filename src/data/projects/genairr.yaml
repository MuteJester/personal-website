name: GenAIRR
tagline: Simulation suite for adaptive immune receptor sequences
description: Generates immunoglobulin and T-cell receptor sequences with full ground-truth annotations, covering V(D)J recombination, somatic hypermutation, indels and sequencing corruption. Rust simulation kernel behind a Python API, 106 built-in configurations across 23 species, and pre-built wheels for Linux, macOS and Windows.
repo: https://github.com/MuteJester/GenAIRR
pypi: GenAIRR
paper: 2024-genairr-aligner-benchmark
kind: research
plain: Generates fully annotated immune-receptor sequences for training and evaluating analysis methods, across 23 species.
tags: [simulation, benchmarking, python, rust]
featured: true
order: 1
