title: An unbiased comparison of immunoglobulin sequence aligners
authors: [Thomas Konstantinovsky, Ayelet Peres, Pazit Polak, Gur Yaari]
venue: Briefings in Bioinformatics
venueShort: Brief. Bioinform.
year: 2024
type: journal
equalContribution: true
doi: 10.1093/bib/bbae556
pdf: /papers/2024-genairr-aligner-benchmark.pdf
code: https://github.com/MuteJester/GenAIRR
selected: true
abstract: >-
  Reliable analysis of AIRR-seq data depends on accurate alignment of rearranged immunoglobulin (Ig) sequences, yet there is no unified benchmarking standard that represents the complexities of real data. We introduce GenAIRR, a modular simulation framework that generates Ig sequences alongside their ground truth, realistically simulating V(D)J recombination, somatic hypermutation and a range of sequence corruptions. Using GenAIRR we assess prominent Ig sequence aligners across a range of metrics and reveal distinct performance characteristics for each. The datasets and evaluation criteria provide a basis for unbiased benchmarking of immunogenetics tools.
