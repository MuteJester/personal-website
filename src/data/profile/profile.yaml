shortBio: >-
  PhD candidate at Bar-Ilan University working on computational immunology,
  deep learning for immune-receptor sequence analysis, and string algorithms.
bio: >-
  I am a PhD candidate in the Faculty of Engineering at Bar-Ilan University,
  working with Gur Yaari on computational immunology. I build methods that make
  adaptive immune receptor repertoires tractable: graph models and
  compression-based encodings of T- and B-cell receptors, deep-learning aligners
  for immunoglobulin sequences, and simulation frameworks for honest
  benchmarking. Most of this work ships as open-source software used across the
  AIRR community.
researchInterests:
