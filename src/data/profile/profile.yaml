name: Thomas Konstantinovsky
headline: Mathematical and computational methods for understanding the immune system
affiliation: PhD candidate · Yaari Lab, Faculty of Engineering, Bar-Ilan University
location: Israel
email: thomaskon90@gmail.com
shortBio: >-
  Computer scientist and applied mathematician bringing graph theory, compression,
  information theory and probability to complex biological and medical problems,
  with a focus on immunology and immune repertoire analysis. PhD candidate at
  Bar-Ilan University.
bio: >-
  I am a computer scientist and applied mathematician. I develop graph-based
  representations, machine-learning methods and simulation tools to study the
  diversity of adaptive immune receptors, drawing on graph theory, data
  compression, information theory and probability. The work connects
  mathematical ideas with open-source research software, including AlignAIR,
  GenAIRR and LZGraphs.
researchInterests:
  - Graph theory
  - Data compression and string algorithms
  - Information theory
  - Probability and statistical modeling
  - Machine learning
  - Computational immunology and immune repertoire analysis
credentials:
  - First- and joint-first-author papers in Nucleic Acids Research, Bioinformatics and Briefings in Bioinformatics.
