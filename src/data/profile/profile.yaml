name: Thomas Konstantinovsky
headline: Mathematics and computer science for complex biological systems
affiliation: Faculty of Engineering, Bar-Ilan University
location: Israel
email: thomaskon90@gmail.com
shortBio: >-
  Computer scientist and applied mathematician bringing graph theory, compression,
  information theory and probability to complex biological and medical problems,
  with a focus on immunology and immune repertoire analysis. PhD candidate at
  Bar-Ilan University.
bio: >-
  I am a computer scientist and applied mathematician working on the biology of
  the immune system. I want to understand human health through data, and to find
  new ways into medical problems that resist conventional approaches. I bring
  graph theory, data compression, information theory and probability to complex
  biological questions, looking for the representation that turns an intractable
  problem into one that can be computed exactly. My current focus is immunology
  and the analysis of adaptive immune receptor repertoires.
researchInterests:
  - Graph theory
  - Data compression and string algorithms
  - Information theory
  - Probability and statistical modeling
  - Machine learning
  - Computational immunology and immune repertoire analysis
