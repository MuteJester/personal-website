shortBio: >-
  Computer scientist researching the adaptive immune system. Expertise in
  probability theory, mathematical modeling, machine learning, data science, and
  information theory, applied to immune receptor repertoire analysis. PhD
  candidate at Bar-Ilan University.
bio: >-
  I am a computer scientist researching the adaptive immune system. My
  expertise is in probability theory and mathematical modeling, machine
  learning and deep learning, data science, and the tools of compression and
  information theory, which I apply to problems in adaptive immune receptor
  repertoire (AIRR) analysis and in biology more broadly. I design algorithms
  and data representations for problems at scale, and I hold them to two
  standards: as efficient as the problem allows, and approachable by anyone,
  whatever their field. Most of my work is released as open-source software.
researchInterests:
  - Markov and graph models
