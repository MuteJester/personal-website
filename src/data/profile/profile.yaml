shortBio: >-
  PhD candidate at Bar-Ilan University working on computational immunology,
  deep learning for immune-receptor sequence analysis, and string algorithms.
bio: >-
  I am a PhD candidate in the Faculty of Engineering at Bar-Ilan University,
  advised by Prof. Gur Yaari. I work on computational immunology: graph-based and
  compression-based representations of T- and B-cell receptor repertoires,
  deep-learning aligners for immunoglobulin sequences, and simulation frameworks
  with full ground truth for benchmarking. The methods are released as open-source
  software (GenAIRR, AlignAIR, LZGraphs). Expected PhD completion: 2027.
researchInterests:
  - Computational immunology
  - Machine learning
  - Graph theory
  - String algorithms and compression
